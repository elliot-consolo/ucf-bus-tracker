<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCF Shuttle Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css" asp-append-version="true">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left brand">
            <span class="brand-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-bus-stop"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 4a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -4" /><path d="M16 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M10 5h7c2.761 0 5 3.134 5 7v5h-2" /><path d="M16 17h-8" /><path d="M16 5l1.5 7h4.5" /><path d="M9.5 10h7.5" /><path d="M12 5v5" /><path d="M5 9v11" /></svg>
            </span>
            <span class="brand-text"><span class="brand-accent">UCF</span> Bus Tracker</span>
        </div>
        <ul class="nav-center">
            <li><button id="liveBtn">Live Chart</button></li>
            <li class="active"><button id="aggBtn">Aggregated Chart</button></li>
            <li><button id="histBtn">Daily History</button></li>
        </ul>
        <div class="nav-right"></div>
    </nav>

    <div class="m controls-row">

        <section class="card route-card">
            <h2 class="card-title">Route</h2>
            <div class="form-group">
                <label for="routeSelect">Shuttle route</label>
                <select id="routeSelect">
                    <option value="">Choose a route</option>
                </select>
            </div>
        </section>

        <section class="card stops-card">
            <h2 class="card-title">Trip</h2>
            <div class="stops-row">
                <div class="form-group">
                    <label for="startStopSelect">Departing from</label>
                    <select id="startStopSelect" disabled>
                        <option value="">Choose a route first</option>
                    </select>
                </div>

                <div class="stop-connector" aria-hidden="true"><span></span></div>

                <div class="form-group">
                    <label for="endStopSelect">Arriving at</label>
                    <select id="endStopSelect" disabled>
                        <option value="">Choose a route first</option>
                    </select>
                </div>

                <button id="loadChartBtn" onclick="fetchChartData()" disabled>Update Chart</button>
            </div>
        </section>

        <section style="display: none" class="card date-card" id="histControls">
            <h2 class="card-title">Date</h2>
            <div class="form-group">
                <label for="dateInput">Service day</label>
                <div class="date-wrapper">
                    <button id="dateLeftBtn" aria-label="Previous day">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <input type="date" id="dateInput" min="2026-09-09">
                    <button id="dateRightBtn" aria-label="Next day">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <section class="m card chart-card">
        <h3 id="chart-title">Overall Travel Times</h3>
        <div class="chart-body">
            <canvas id="transitChart"></canvas>
            <div class="chart-loading" id="chartLoading" hidden>
                <svg class="wheel" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                    <circle cx="24" cy="24" r="20" stroke-width="5"/>
                    <circle cx="24" cy="24" r="4" stroke-width="3"/>
                    <path d="M24 20V6M24 28v14M20.5 22 8.4 15M27.5 26l12.1 7M20.5 26 8.4 33M27.5 22l12.1-7" stroke-width="2.5"/>
                </svg>
                <span>Loading travel times…</span>
            </div>
            <div class="chart-empty" id="chartEmpty">Pick a route and two stops to see travel times.</div>
        </div>
    </section>

    <script>
        let transitChart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            
            await loadRoutes();
        });

        const liveChartBtn = document.getElementById('liveBtn');
        const aggChartBtn = document.getElementById('aggBtn');
        const histChartBtn = document.getElementById('histBtn');
        const chartText = document.getElementById('chart-title');
        const histControls = document.getElementById('histControls');

        liveChartBtn.addEventListener('click', () => {
            cleanPage();
            liveChartBtn.parentElement.classList.add('active');
            chartText.innerText = "Today's Travel Times";
            if (validData()) {
                fetchChartData();
            }
        });

        aggChartBtn.addEventListener('click', () => {
            cleanPage();
            aggChartBtn.parentElement.classList.add('active');
            chartText.innerText = "Overall Travel Times";
            if (validData()) {
                fetchChartData();
            }
        });

        histChartBtn.addEventListener('click', () => {
            cleanPage();

            const dateInput = document.getElementById('dateInput');

            if (!dateInput.value) {
                const formattedToday = getDate();
                const dateRightBtn = document.getElementById('dateRightBtn');
                dateInput.value = formattedToday;
                dateInput.max = formattedToday;
                dateRightBtn.disabled = true;                
            }

            const dateString = trimDateString(dateInput.valueAsDate.toUTCString());
            chartText.innerText = `${dateString} Travel Times`;

            histChartBtn.parentElement.classList.add('active');
            histControls.style.display = 'block';

            if (validData()) {
                fetchChartData();
            }
        });

        const dateLeftBtn = document.getElementById('dateLeftBtn');
        const dateRightBtn = document.getElementById('dateRightBtn');

        dateLeftBtn.addEventListener('click', () => {
            const dateInput = document.getElementById('dateInput');
            const dateValue = dateInput.valueAsDate;

            if (!dateValue) return;

            dateValue.setDate(dateValue.getDate()-1);
            
            const minStr = dateInput.getAttribute('min');
            const minDate = minStr ? new Date(minStr) : null;

            if (!minDate) return;

            if (dateValue < minDate) return;

            dateInput.valueAsDate = dateValue;

            const event = new Event('change', { bubbles: true});
            dateInput.dispatchEvent(event);

            if (validData()) {
                fetchChartData();
            }
        });

        dateRightBtn.addEventListener('click', () => {
            const dateInput = document.getElementById('dateInput');
            const dateValue = dateInput.valueAsDate;

            if (!dateValue) return;

            dateValue.setDate(dateValue.getDate()+1);
            
            const maxStr = dateInput.getAttribute('max');
            const maxDate = maxStr ? new Date(maxStr) : null;

            if (!maxDate) return;

            if (dateValue > maxDate) return;

            dateInput.valueAsDate = dateValue;

            const event = new Event('change', { bubbles: true});
            dateInput.dispatchEvent(event);

            if (validData()) {
                fetchChartData();
            }
        });

        document.getElementById('dateInput').addEventListener('change', (e) =>{
            const dateValue = e.target.valueAsDate;
            const minStr = e.target.getAttribute('min');
            const maxStr = e.target.getAttribute('max');
            
            const dateString = trimDateString(dateValue.toUTCString());
            const chartText = document.getElementById('chart-title');
            chartText.innerText = `${dateString} Travel Times`;

            const minDate = minStr ? new Date(minStr) : null;
            const maxDate = maxStr ? new Date(maxStr) : null;

            if (dateValue.toDateString() === minDate.toDateString()) {
                dateLeftBtn.disabled = true;
            }

            if (dateValue.toDateString() === maxDate.toDateString()) {
                dateRightBtn.disabled = true;
            }

            if (dateLeftBtn.disabled && dateValue > minDate) {
                dateLeftBtn.disabled = false;
            }

            if (dateRightBtn.disabled && dateValue < maxDate) {
                dateRightBtn.disabled = false;
            }
        });
        

        function validData() {
            const routeId = document.getElementById('routeSelect').value;
            const startStopId = document.getElementById('startStopSelect').value;
            const endStopId = document.getElementById('endStopSelect').value;

            if (!routeId || !startStopId || !endStopId) {
                return false;
            }

            if (startStopId === endStopId) {
                return false;
            }

            return true;
        }


        const loadChartBtn = document.getElementById('loadChartBtn');
        const chartLoading = document.getElementById('chartLoading');

        function updateLoadBtnState() {
            loadChartBtn.disabled = !validData() || !chartLoading.hidden;
        }

        document.getElementById('startStopSelect').addEventListener('change', updateLoadBtnState);
        document.getElementById('endStopSelect').addEventListener('change', updateLoadBtnState);

        function setLoading(isLoading) {
            chartLoading.hidden = !isLoading;
            updateLoadBtnState();
        }

        function cleanPage() {
            liveChartBtn.parentElement.classList.remove('active');
            aggChartBtn.parentElement.classList.remove('active');
            histChartBtn.parentElement.classList.remove('active');

            histControls.style.display = 'none';
        }

        function getDate() {
            const today = new Date();

            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const formattedToday = `${yyyy}-${mm}-${dd}`;
            return formattedToday;
        }

        function getDateEastern() {
            //en-CA formats as YYYY-MM-DD
            return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
        }

        function trimDateString(str) {
            const shortStr = str.substring(0,16);
            var newStr = '';
            switch(shortStr.substring(0,3)){
                case 'Mon':
                    newStr += 'Monday ';
                    break;
                case 'Tue':
                    newStr += 'Tuesday ';
                    break;
                case 'Wed':
                    newStr += 'Wednesday ';
                    break;
                case 'Thu':
                    newStr += 'Thursday ';
                    break;
                case 'Fri':
                    newStr += 'Friday ';
                    break;
                case 'Sat':
                    newStr += 'Saturday ';
                    break;
                case 'Sun':
                    newStr += 'Sunday ';
                    break;
            }
            newStr += shortStr.substring(8,12);
            newStr += shortStr.substring(5,8);
            newStr += shortStr.substring(12,17);

            return newStr;
        }

        async function loadRoutes() {
            try {
                const response = await fetch("api/transit/routes");
                const routes = await response.json();

                const routeSelect = document.getElementById('routeSelect');
                routeSelect.innerHTML = '<option value="">Choose a route</option>';

                routes.forEach(route => {
                    const option = document.createElement('option');
                    option.value = route.routeId;
                    option.text = `${route.routeName}`;
                    routeSelect.appendChild(option);
                });
            }
            catch (err) {
                console.error("Error loading routes:", err);
            }
        }

        document.getElementById('routeSelect').addEventListener('change', async (e) => {
            const routeId = e.target.value;
            const startSelect = document.getElementById('startStopSelect');
            const endSelect = document.getElementById('endStopSelect');

            if (!routeId) {
                startSelect.innerHTML = '<option value="">Choose a route first</option>';
                endSelect.innerHTML = '<option value="">Choose a route first</option>';
                startSelect.disabled = true;
                endSelect.disabled = true;
                updateLoadBtnState();
                return;
            }

            try {
                const response = await fetch(`api/transit/stops?routeId=${encodeURIComponent(routeId)}`);
                const stops = await response.json();

                populateStopsDropdown(startSelect, stops, "Choose where you board");
                populateStopsDropdown(endSelect, stops, "Choose where you get off");

                startSelect.disabled = false;
                endSelect.disabled = false;
            }
            catch (err) {
                console.error("Error loading stops:", err);
            }
            finally {
                updateLoadBtnState();
            }
        });

        function populateStopsDropdown(dropdownElement, stops, dropdownText) {
            dropdownElement.innerHTML = `<option value="">${dropdownText}</option>`;
            stops.forEach(stop => {
                const option = document.createElement('option');
                option.value = stop.sequenceOrder;
                option.text = `Stop ${stop.sequenceOrder} - ${stop.stopName}`;
                dropdownElement.appendChild(option);
            });
        }

        async function fetchChartData() {
            const routeId = document.getElementById('routeSelect').value;
            const startStopId = document.getElementById('startStopSelect').value;
            const endStopId = document.getElementById('endStopSelect').value;
            

            if (!routeId || !startStopId || !endStopId) {
                alert("Please select a Route, Start Stop, and End Stop.");
                return;
            }

            if (startStopId === endStopId) {
                alert("Start Stop and End Stop cannot be the same.");
                return;
            }

            var date = '';
            const active = document.querySelector('.active').children;

            if (active[0].id == 'liveBtn') {
                date = getDateEastern();
            }
            else if (active[0].id == 'histBtn') {
                tmpDate = document.getElementById('dateInput').valueAsDate;
                date = tmpDate.toISOString().split('T')[0];
            }

            setLoading(true);

            try {
                const response = await fetch(`api/congestion/analytics?routeId=${encodeURIComponent(routeId)}&startStopId=${startStopId}&endStopId=${endStopId}&date=${date}`);
                const data = await response.json();

                //calculate avg of avgDurationMinutes
                let sum = 0;
                let num = 0;
                data.forEach(pt => {
                    if (pt.avgDurationMinutes != null) {
                        sum += pt.avgDurationMinutes;
                        num++;
                    }   
                });
                const avgValues = sum/num;

                //remove outliers
                let outlierMult = 2.5;
                data.forEach(pt => {
                    if (pt.avgDurationMinutes > (avgValues*outlierMult)) {
                        pt.avgDurationMinutes = null;
                        //console.log(pt.timeLabel + " removed");
                    }   
                });

                renderChart(data);
            } catch (error) {
                console.error("Failed to load shuttle data from API:", error);
            } finally {
                setLoading(false);
            }
        }

        function renderChart(apiData) {

            const ctx = document.getElementById('transitChart').getContext('2d');

            if(transitChart) {
                transitChart.destroy();
            }

            document.getElementById('chartEmpty').hidden = true;

            transitChart = new Chart(ctx, {
                type: 'line',
                data: {
                    //minute labels array
                    labels: apiData.map(d => d.timeLabel),
                    datasets: [{
                        label: 'Average Transit Duration (Min)',
                        //minute data array
                        data: apiData.map(d => d.avgDurationMinutes),

                        spanGaps: true,

                        borderColor: '#ffc904',
                        backgroundColor: 'rgba(255, 201, 4, 0.10)',
                        pointBackgroundColor: '#ffc904',
                        fill: true,
                        hitRadius: 2,
                        pointRadius: 1,
                        pointHoverRadius: 6,
                        borderWidth: 2,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#f2f2f3', boxWidth: 12 } },
                        tooltip: {
                            backgroundColor: '#000000',
                            borderColor: '#3a3a40',
                            borderWidth: 1,
                            titleColor: '#ffc904',
                            bodyColor: '#f2f2f3'
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            border: { color: '#3a3a40' },
                            ticks: {
                                color: '#9b9ba3',
                                autoSkip: false,
                                maxRotation: 0,
                                //reduce label ticks
                                callback: function (val, index) {
                                    const label = this.getLabelForValue(val);
                                    return label.includes(':00') ? label : '';
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: '#26262b' },
                            border: { color: '#3a3a40' },
                            ticks: { color: '#9b9ba3' },
                            title: { display: true, text: 'Minutes', color: '#9b9ba3' }
                        }
                    }
                }
            });
        }
    </script>
</body>
